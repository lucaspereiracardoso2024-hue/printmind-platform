name: Build & Release PrintMind Binaries (Server + Satellite Agent + Windows MSI)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Go Vet & Automated Tests
        run: |
          go vet ./...
          go test -v -count=1 -race ./...

      - name: Verify & Build PrintMind Cloud Server (Linux AMD64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/printmind-server-linux-amd64 .

      - name: Build PrintMind Server Standalone (Windows AMD64)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/printmind-server.exe .

      - name: Build PrintMind Scanner Agent v4.2.0 (Windows GUI Subsystem, Zero-AV Hygiene, Preserves Symbols)
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui" -o ../../dist/printmind-agent.exe .

      - name: Build PrintMind Scanner Agent v4.2.0 (Linux AMD64 Pure Go)
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../../dist/printmind-agent-linux-amd64 .

      - name: Verify Cross-Compilation & Copy Packaging Templates
        run: |
          mkdir -p dist/packaging
          cp cmd/agent/packaging/printmind-agent.service dist/packaging/
          cp cmd/agent/packaging/printmind-agent.wxs dist/packaging/
          sha256sum dist/printmind-agent.exe dist/printmind-agent-linux-amd64 > dist/SHA256SUMS.txt

      - name: Upload Compiled Binaries as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: printmind-v4-binaries
          path: dist/*
          retention-days: 30

  build-windows-msi:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Compiled Binaries
        uses: actions/download-artifact@v4
        with:
          name: printmind-v4-binaries
          path: dist

      - name: Sign Windows Agent Executable (Optional Authenticode OV)
        if: env.HAS_WIN_CERT == 'true'
        env:
          HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /fd SHA256 /f $pfxPath /p $env:CERT_PASS /tr http://timestamp.digicert.com /td SHA256 dist/printmind-agent.exe
          Remove-Item $pfxPath -Force

      - name: Install Open-Source WiX Toolset CLI (v5.0.2)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile Windows MSI Installer (x64)
        shell: pwsh
        run: |
          wix --version
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix build cmd/agent/packaging/printmind-agent.wxs -arch x64 -b dist -ext WixToolset.Util.wixext -o dist/PrintMindAgentSetup-v4.2.0-x64.msi

      - name: Sign Windows MSI Installer (Optional Authenticode OV)
        if: env.HAS_WIN_CERT == 'true'
        env:
          HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /fd SHA256 /f $pfxPath /p $env:CERT_PASS /tr http://timestamp.digicert.com /td SHA256 dist/PrintMindAgentSetup-v4.2.0-x64.msi
          Remove-Item $pfxPath -Force

      - name: Generate Final Checksums
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash -Algorithm SHA256 -Path dist/printmind-agent.exe).Hash.ToLower()
          $linuxHash = (Get-FileHash -Algorithm SHA256 -Path dist/printmind-agent-linux-amd64).Hash.ToLower()
          $msiHash = (Get-FileHash -Algorithm SHA256 -Path dist/PrintMindAgentSetup-v4.2.0-x64.msi).Hash.ToLower()
          @(
            "$exeHash  dist/printmind-agent.exe"
            "$linuxHash  dist/printmind-agent-linux-amd64"
            "$msiHash  dist/PrintMindAgentSetup-v4.2.0-x64.msi"
          ) | Set-Content -Path dist/SHA256SUMS.txt

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: printmind-v4.2.0-windows-msi
          path: |
            dist/PrintMindAgentSetup-v4.2.0-x64.msi
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v4.2.0' }}
          name: PrintMind v4.2.0
          generate_release_notes: true
          files: |
            dist/PrintMindAgentSetup-v4.2.0-x64.msi
            dist/printmind-agent.exe
            dist/printmind-agent-linux-amd64
            dist/printmind-server-linux-amd64
            dist/printmind-server.exe
            dist/SHA256SUMS.txt
