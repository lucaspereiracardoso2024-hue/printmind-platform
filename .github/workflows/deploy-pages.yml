name: Deploy PrintMind Live Web App to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for Frontend Smoke Check
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Frontend Inline JS & Critical Elements
        run: |
          node -e '
          const fs = require("fs");
          const vm = require("vm");
          const html = fs.readFileSync("index.html", "utf8");
          const requiredIds = ["authScreen", "appScreen", "formLogin", "formSignup", "formForgotPassword", "formResetPassword", "agentModal", "agentMsiCard", "printersGrid", "sectionMaster", "masterSubTabTenants", "masterSubTabBilling", "masterSubTabFraud", "suspendedTenantOverlay", "masterTenantDetailModal", "fairBillingBadge", "simStarterRechargeNote", "btnExportErpCSV", "clientAdjustmentModal", "spareTonersModal", "printerDetailModal"];
          for (const id of requiredIds) {
            if (!html.includes(`id="${id}"`)) throw new Error(`Missing required element id=${id}`);
          }
          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
          if (scripts.length === 0) throw new Error("No inline scripts found in index.html");
          scripts.forEach((m, i) => new vm.Script(m[1], { filename: `inline-script-${i}.js` }));
          console.log(`Validated ${scripts.length} inline script(s) and ${requiredIds.length} critical DOM IDs.`);
          '

      - name: Prepare Static Web Bundle
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          [ -f printmind-agent.exe ] && cp printmind-agent.exe _site/printmind-agent.exe || true
          [ -f printmind-agent-linux-amd64 ] && cp printmind-agent-linux-amd64 _site/printmind-agent-linux-amd64 || true
          [ -f printmind-config.json ] && cp printmind-config.json _site/printmind-config.json || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
