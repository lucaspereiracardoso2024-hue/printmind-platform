name: Deploy PrintMind Live Web App to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Check
        run: npm run typecheck

      - name: ESLint Verification
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Validate Critical DOM IDs
        run: |
          node -e '
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const requiredIds = [
            "portalScreen", "authScreen", "appScreen", "formLogin", "formSignup",
            "formForgotPassword", "formResetPassword", "agentModal", "agentMsiCard",
            "printersGrid", "sectionMaster", "masterSubTabTenants", "masterSubTabBilling",
            "masterSubTabFraud", "suspendedTenantOverlay", "masterTenantDetailModal",
            "fairBillingBadge", "simStarterRechargeNote", "btnExportErpCSV",
            "clientAdjustmentModal", "spareTonersModal", "printerDetailModal", "portalQrModal"
          ];
          for (const id of requiredIds) {
            if (!html.includes(`id="${id}"`)) throw new Error(`Missing required element id=${id}`);
          }
          console.log(`Validated ${requiredIds.length} critical DOM IDs.`);
          '

      - name: Build Production Bundle (Vite)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://zbsmzcbcivhzslcnfxmq.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpic216Y2JjaXZoenNsY25meG1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NDUxNTcsImV4cCI6MjExMDAyMTE1N30.U9F-EL3ddBBqEK0MqkNuZBC6ZvwtuEElN6Z_VpEGT7Q' }}
        run: npm run build

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site
          cp -r dist/* _site/
          (cd cmd/agent && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui" -o ../../_site/printmind-agent.exe .)
          (cd cmd/agent && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../../_site/printmind-agent-linux-amd64 .)
          [ -f printmind-config.json ] && cp printmind-config.json _site/printmind-config.json || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
